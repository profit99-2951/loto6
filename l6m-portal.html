<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F8F7F4;
    --surface: #FFFFFF;
    --surface2: #F2F1EE;
    --border: #E4E2DC;

  body {

  .card-title {

  .num-btn.selected-banned { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }

  /* Toggle switch */
  .toggle-wrap { flex-shrink: 0; }
  .toggle {

    width: 36px; height: 20px; cursor: pointer;
  }
  .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-track {
    position: absolute; inset: 0;
    background: var(--border); border-radius: 20px;
    transition: background 0.2s;
  }
  .toggle input:checked ~ .toggle-track { background: var(--blue); }
  .toggle-thumb {
    position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; border-radius: 50%;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(password) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64(ENC.nonce) }, key, b64(ENC.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function tryUnlock(password, remember) {
  const btn = document.getElementById('memberBtn');
  const err = document.getElementById('memberPwErr');
  btn.disabled = true;
  err.textContent = '確認しています…';
  try {
    const content = await unlock(password);
    document.getElementById('memberGate').style.display = 'none';
    document.getElementById('memberContent').innerHTML = content.html;
    const s = document.createElement('script');
    s.textContent = content.js;
    document.body.appendChild(s);
    if (remember) { try { sessionStorage.setItem('l6pw', password); } catch (e) {} }
    if (typeof gtag === 'function') gtag('event', 'member_tool_open');
  } catch (e) {
    btn.disabled = false;
    err.textContent = '合言葉が違います。';
    try { sessionStorage.removeItem('l6pw'); } catch (e2) {}
  }
}

document.getElementById('memberBtn').addEventListener('click', () => {
  tryUnlock(document.getElementById('memberPw').value.trim(), true);
});
document.getElementById('memberPw').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    tryUnlock(document.getElementById('memberPw').value.trim(), true);
  }
});

// 同じタブ内では再入力を省略
try {
  const saved = sessionStorage.getItem('l6pw');
  if (saved) tryUnlock(saved, false);
} catch (e) {}
